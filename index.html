<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13171A">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Legjobb Énem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#F4EFE6; --surface:#FBF8F1; --surface-2:#EFE7D8; --raise:#FFFFFF;
    --ink:#23201A; --ink-soft:#6C6558; --ink-faint:#9C9484;
    --line:#E3DACA; --line-soft:#EDE6D8;
    --accent:#B0752A; --accent-2:#E5B45E; --accent-ink:#3B2A10;
    --sage:#5F7F5C; --sage-soft:#E7EEE2;
    --danger:#B0483B;
    --shadow:0 1px 2px rgba(45,35,15,.05), 0 10px 30px -18px rgba(45,35,15,.28);
    --shadow-lift:0 2px 6px rgba(45,35,15,.08), 0 22px 50px -24px rgba(45,35,15,.35);
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:'Mulish', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --r:16px; --r-sm:11px; --r-lg:22px;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#13171A; --surface:#1B2126; --surface-2:#232B31; --raise:#20272C;
      --ink:#ECE5D8; --ink-soft:#9BA39F; --ink-faint:#6E777A;
      --line:#2C353B; --line-soft:#242C32;
      --accent:#E4A952; --accent-2:#F0C98A; --accent-ink:#20160A;
      --sage:#93B08C; --sage-soft:#20302321;
      --danger:#E0776A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -20px rgba(0,0,0,.7);
      --shadow-lift:0 2px 8px rgba(0,0,0,.4), 0 26px 60px -26px rgba(0,0,0,.8);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13171A; --surface:#1B2126; --surface-2:#232B31; --raise:#20272C;
    --ink:#ECE5D8; --ink-soft:#9BA39F; --ink-faint:#6E777A;
    --line:#2C353B; --line-soft:#242C32;
    --accent:#E4A952; --accent-2:#F0C98A; --accent-ink:#20160A;
    --sage:#93B08C; --sage-soft:#20302321;
    --danger:#E0776A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -20px rgba(0,0,0,.7);
    --shadow-lift:0 2px 8px rgba(0,0,0,.4), 0 26px 60px -26px rgba(0,0,0,.8);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #app{
    max-width:540px; margin:0 auto; height:100%;
    display:flex; flex-direction:column; position:relative;
    background:var(--bg);
  }

  /* ---------- shared bits ---------- */
  .screen{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .pad{padding:22px 20px 34px;}
  h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.01em;}
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin:0 0 8px;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);}
  button{font-family:var(--sans); cursor:pointer;}
  textarea,input,select{font-family:var(--sans); color:var(--ink);}
  textarea:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible,.chip:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .btn{
    border:none; border-radius:var(--r); padding:15px 20px; font-size:16px; font-weight:700;
    background:var(--accent); color:#fff; width:100%; letter-spacing:.01em;
    box-shadow:var(--shadow); transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:translateY(1px) scale(.995);}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn.ghost{background:transparent; color:var(--ink-soft); box-shadow:none; border:1px solid var(--line);}
  .btn.small{width:auto; padding:11px 16px; font-size:14px; border-radius:var(--r-sm);}
  .btn.sage{background:var(--sage); color:#fff;}
  .row{display:flex; gap:10px;}
  .row.wrap{flex-wrap:wrap;}

  textarea, input[type=text]{
    width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r);
    padding:14px 15px; font-size:16px; line-height:1.5; resize:vertical; color:var(--ink);
  }
  textarea{min-height:120px;}
  ::placeholder{color:var(--ink-faint);}
  label.field{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin:0 0 7px; letter-spacing:.02em;}

  .chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    border-radius:999px; padding:9px 15px; font-size:14px; font-weight:600;
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* ---------- intro ---------- */
  .intro{min-height:100%; display:flex; flex-direction:column; justify-content:center; padding:40px 26px;}
  .halo{width:96px; height:96px; margin:0 auto 26px; display:block;}
  .intro h1{font-size:clamp(32px,9vw,44px); line-height:1.02; text-align:center;}
  .intro .lede{text-align:center; color:var(--ink-soft); font-size:17px; margin:16px auto 0; max-width:33ch;}
  .intro .steps{margin:30px 0 34px; display:flex; flex-direction:column; gap:14px;}
  .istep{display:flex; gap:14px; align-items:flex-start;}
  .istep .n{font-family:var(--serif); font-weight:600; color:var(--accent); font-size:19px; width:26px; flex:none; line-height:1.35;}
  .istep b{font-weight:700;}
  .istep p{margin:2px 0 0; color:var(--ink-soft); font-size:14.5px;}

  /* ---------- onboarding ---------- */
  .progress{height:5px; background:var(--line-soft); border-radius:99px; overflow:hidden; margin:2px 0 0;}
  .progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:99px; transition:width .3s ease;}
  .qwrap{padding:20px 20px 26px; display:flex; flex-direction:column; min-height:100%;}
  .qhead{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:18px;}
  .qcard{flex:1;}
  .qcard .dimtag{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:12px;}
  .qcard h2{font-size:clamp(24px,6.4vw,30px); line-height:1.12; margin-bottom:8px;}
  .qcard .hint{color:var(--ink-soft); font-size:14.5px; margin:0 0 18px;}
  .qnav{display:flex; gap:12px; padding-top:16px;}
  .qnav .btn{flex:1;}
  .backlink{background:none; border:none; color:var(--ink-faint); font-size:15px; font-weight:600; padding:6px 4px; width:auto;}

  /* ---------- reveal ---------- */
  .reveal{min-height:100%; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:40px 28px;}
  .reveal h1{font-size:clamp(30px,8vw,40px); line-height:1.05;}
  .reveal .sig{font-family:var(--serif); font-style:italic; font-size:22px; color:var(--accent); margin-top:10px;}
  .reveal p{color:var(--ink-soft); margin:18px auto 0; max-width:34ch;}

  /* ---------- header / tabs ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
    padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line-soft);
  }
  .topbar .t{font-family:var(--serif); font-size:20px; font-weight:600;}
  .iconbtn{background:none; border:1px solid var(--line); border-radius:10px; width:38px; height:38px; display:grid; place-items:center; color:var(--ink-soft);}

  .tabbar{
    display:flex; background:var(--surface); border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--ink-faint); font-size:11.5px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 4px; border-radius:12px; letter-spacing:.02em;
  }
  .tabbar button.on{color:var(--accent);}
  .tabbar button.on .ic{background:var(--surface-2);}
  .tabbar .ic{width:30px; height:30px; display:grid; place-items:center; border-radius:9px; transition:background .15s;}
  .tabbar svg{width:22px; height:22px;}

  /* ---------- cards ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 16px; box-shadow:var(--shadow);}
  .card + .card{margin-top:14px;}
  .sec-title{display:flex; align-items:baseline; gap:9px; margin:26px 2px 12px;}
  .sec-title h3{font-size:19px;}
  .sec-title .k{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);}
  .qa{}
  .qa + .qa{border-top:1px solid var(--line-soft); margin-top:12px; padding-top:12px;}
  .qa .q{font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .qa .a{font-size:15.5px; white-space:pre-wrap; line-height:1.55;}
  .qa .a.empty{color:var(--ink-faint); font-style:italic;}
  .edit-ta{margin-top:6px; min-height:70px; font-size:15px;}

  .hero-self{
    background:linear-gradient(160deg, color-mix(in srgb,var(--accent) 16%, var(--surface)), var(--surface));
    border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 18px; box-shadow:var(--shadow-lift);
  }
  .hero-self .lbl{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:9px;}
  .hero-self .oneline{font-family:var(--serif); font-size:23px; line-height:1.22; font-weight:500;}
  .hero-self .meta{margin-top:12px; color:var(--ink-soft); font-size:13.5px;}

  /* ---------- compass ---------- */
  .compass-intro{margin:4px 2px 16px;}
  .compass-intro h2{font-size:22px; margin-bottom:6px;}
  .quicks{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px;}
  .result{
    margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow-lift); overflow:hidden;
  }
  .result .rhead{padding:15px 17px 12px; background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%, var(--surface)),var(--surface)); border-bottom:1px solid var(--line);}
  .result .rhead .lbl{font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);}
  .result .rbody{padding:16px 17px 18px;}
  .rblock{margin-bottom:16px;}
  .rblock:last-child{margin-bottom:0;}
  .rblock .h{font-size:12.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:7px;}
  .rblock p{margin:0; font-size:15.5px; line-height:1.58;}
  .steps-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px;}
  .steps-list li{display:flex; gap:11px; font-size:15.5px; line-height:1.5;}
  .steps-list .sn{flex:none; width:24px; height:24px; border-radius:8px; background:var(--accent); color:#fff; font-size:13px; font-weight:800; display:grid; place-items:center; margin-top:1px;}
  .quote{
    font-family:var(--serif); font-style:italic; font-size:18px; line-height:1.4;
    border-left:3px solid var(--accent); padding:2px 0 2px 15px; color:var(--ink);
  }
  .quote .who{display:block; font-style:normal; font-family:var(--sans); font-size:12.5px; font-weight:700; letter-spacing:.04em; color:var(--ink-faint); margin-top:8px; text-transform:uppercase;}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px; letter-spacing:.03em;}
  .badge.ai{background:var(--sage-soft); color:var(--sage); border:1px solid color-mix(in srgb,var(--sage) 30%, transparent);}
  .badge.off{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);}
  .thinking{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:15px; padding:22px 4px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.18s} .dot:nth-child(3){animation-delay:.36s}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

  .hist{margin-top:26px;}
  .hist h3{font-size:16px; margin:0 0 10px 2px;}
  .hitem{border:1px solid var(--line-soft); background:var(--surface); border-radius:12px; padding:12px 14px; margin-bottom:9px;}
  .hitem .hs{font-size:14px; font-weight:600; margin-bottom:3px;}
  .hitem .hd{font-size:12px; color:var(--ink-faint);}

  /* settings */
  .set-row{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line-soft);}
  .set-row:last-child{border-bottom:none;}
  .set-row .k{font-weight:700; font-size:15px;}
  .set-row .d{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  select{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:9px 11px; font-size:14px; font-weight:600;}
  .switch{width:50px; height:30px; border-radius:99px; border:none; background:var(--line); position:relative; flex:none;}
  .switch.on{background:var(--sage);}
  .switch i{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .16s ease; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on i{left:23px;}
  .note{font-size:12.5px; color:var(--ink-soft); background:var(--surface-2); border-radius:10px; padding:11px 13px; line-height:1.5;}
  .toast{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:11px 18px; border-radius:99px; font-size:14px; font-weight:600; z-index:50; box-shadow:var(--shadow-lift);
    opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:88%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .link{color:var(--accent); font-weight:700; text-decoration:none; border-bottom:1px solid color-mix(in srgb,var(--accent) 40%, transparent);}
  .daily{background:linear-gradient(160deg,var(--sage-soft),var(--surface)); border:1px solid color-mix(in srgb,var(--sage) 26%, var(--line)); border-radius:var(--r); padding:15px 16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .daily .dl{font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); margin-bottom:7px;}
  .daily p{margin:0; font-family:var(--serif); font-size:17px; line-height:1.36; font-style:italic;}
  .statstrip{display:flex; gap:10px; margin:14px 0 2px;}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 10px; text-align:center;}
  .stat b{display:block; font-family:var(--serif); font-size:23px; line-height:1; color:var(--accent);}
  .stat span{font-size:11px; color:var(--ink-soft); font-weight:600; display:block; margin-top:5px; letter-spacing:.02em;}
  .donebar{display:flex; gap:11px; padding:13px 17px 16px; border-top:1px solid var(--line-soft); align-items:center;}
  .donebar .msg{font-size:13px; color:var(--ink-soft); flex:1; line-height:1.35;}
  .btn.done{background:var(--sage); width:auto; padding:11px 16px; font-size:14px; border-radius:var(--r-sm); flex:none;}
  .doneflag{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--sage); padding:13px 17px 16px; border-top:1px solid var(--line-soft);}
  .modeseg{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:13px; padding:4px; margin:2px 0 18px;}
  .modeseg button{flex:1; border:none; background:transparent; color:var(--ink-soft); font-family:var(--sans); font-size:14px; font-weight:700; padding:10px 8px; border-radius:9px; transition:background .15s, color .15s;}
  .modeseg button.on{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}
  .bizfield textarea{min-height:68px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important;} }
</style>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* ============ persistence ============ */
var LS_KEY = "legjobb_enem_v1";
function loadState(){
  var base = { profile:null, biz:null, history:[], actions:[], settings:{ aiEnabled:false, provider:"openrouter", apiKey:"", quality:"default", theme:"system" } };
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var p = JSON.parse(raw); return Object.assign(base, p, { settings: Object.assign(base.settings, p.settings||{}) }); }
  }catch(e){}
  return base;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var view = state.profile ? "app" : "intro";  // intro | onboarding | reveal | app
var tab = "self";                            // self | compass | settings
var qIndex = 0;
var draft = {};                              // onboarding in-progress answers
var bizDraft = {};                           // business intake in-progress answers
var compass = { input:"", result:null, loading:false, mode:"self" };

/* ============ questions ============ */
var SECTIONS = [
  { key:"identity", label:"Az alap" },
  { key:"inner", label:"Belső világ" },
  { key:"outer", label:"Kisugárzás & megjelenés" },
  { key:"career", label:"Hivatás" },
  { key:"life", label:"Élet & kapcsolatok" },
  { key:"why", label:"A miért" }
];

var QUESTIONS = [
  { id:"name",     sec:"identity", dim:"Az alap", q:"Hogy hívod a legjobb, jövőbeli éned?", hint:"A saját neved, vagy egy szó, ami ezt az embert jelöli. Ezen a néven fog majd szólni hozzád.", chips:null },
  { id:"horizon",  sec:"identity", dim:"Az alap", q:"Milyen távoli ez a jövőbeli éned?", hint:"Hány év múlva vagy ott, ahol ő?", chips:["1 év","3 év","5 év","10 év"] },
  { id:"oneline",  sec:"identity", dim:"Az alap", q:"Egy mondatban: milyen ember a legjobb éned?", hint:"Ne gondold túl — ahogy elsőre, zsigerből jön.", chips:null },
  { id:"inner",    sec:"inner",    dim:"Belső világ", q:"Milyen belső tulajdonságai vannak?", hint:"Hogyan gondolkodik, mit érez? Pl. nyugodt, bátor, fegyelmezett, kedves, magabiztos.", chips:null },
  { id:"values",   sec:"inner",    dim:"Belső világ", q:"Mi a 3 legfontosabb érték, ami vezérli?", hint:"Pl. szabadság, becsület, fejlődés, család, egészség.", chips:null },
  { id:"avoids",   sec:"inner",    dim:"Belső világ", q:"Mit NEM csinál már a legjobb éned?", hint:"Régi szokások, minták, amiket maga mögött hagyott.", chips:null },
  { id:"outer",    sec:"outer",    dim:"Kisugárzás", q:"Milyen a kisugárzása mások előtt?", hint:"Ahogy belép egy térbe, ahogy beszél, ahogy hatással van másokra.", chips:null },
  { id:"look",     sec:"outer",    dim:"Megjelenés", q:"Hogy néz ki? Stílus, tartás, megjelenés?", hint:"Pl. ápolt, jó tartás, saját stílus, magabiztos testbeszéd.", chips:null },
  { id:"body",     sec:"outer",    dim:"Test & sport", q:"Milyen a fizikai formája? Hogyan sportol?", hint:"Pl. heti 4x edz, erős, kitartó, fut, jógázik, energikus.", chips:null },
  { id:"career",   sec:"career",   dim:"Hivatás", q:"Mivel foglalkozik? Milyen a munkája?", hint:"A munka vagy hivatás, ami tölti és ad neki valamit.", chips:null },
  { id:"careerwhy",sec:"career",   dim:"Hivatás", q:"Miért pont ezt csinálja? Mit ad neki?", hint:"A mélyebb ok a karrier vagy cél mögött.", chips:null },
  { id:"habits",   sec:"life",     dim:"Napok", q:"Milyen a napja? Milyen szokásai vannak?", hint:"Reggel, este, ismétlődő rutinok, amik felépítik.", chips:null },
  { id:"people",   sec:"life",     dim:"Kapcsolatok", q:"Kikkel veszi körül magát?", hint:"Barátok, párkapcsolat, közeg — milyenek a kapcsolatai?", chips:null },
  { id:"proud",    sec:"why",      dim:"A miért", q:"Mire a legbüszkébb ez a jövőbeli éned?", hint:"Egy dolog, amit elért, vagy amivé vált.", chips:null },
  { id:"why",      sec:"why",      dim:"A miért", q:"Miért akarsz ilyenné válni?", hint:"Az igazi hajtóerő. Ez lesz a horgony, amikor nehéz.", chips:null }
];

var BIZ_QUESTIONS = [
  { id:"biz_what",      q:"Mivel foglalkozik a vállalkozásod?", hint:"Termék vagy szolgáltatás, egy-két mondatban.", chips:null },
  { id:"biz_who",       q:"Kik az ügyfeleid?", hint:"Célközönség — kiknek segítesz, kik fizetnek.", chips:null },
  { id:"biz_stage",     q:"Hol tart most a vállalkozás?", hint:"Válassz, vagy írd le pontosabban.", chips:["Ötlet fázis","Most indul","Már működik","Skálázás alatt"] },
  { id:"biz_goal",      q:"Mi a fő célod a következő 6–12 hónapban?", hint:"Minél konkrétabb és mérhetőbb, annál jobb tanácsot tudok adni.", chips:null },
  { id:"biz_challenge", q:"Mi most a legnagyobb kihívásod?", hint:"Ami leginkább akadályoz a cél felé.", chips:null },
  { id:"biz_strength",  q:"Mi a legnagyobb erősséged / előnyöd?", hint:"Amire építeni tudsz.", chips:null }
];

/* ============ helpers ============ */
var $ = function(s,r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function ans(id){ return state.profile && state.profile[id] ? String(state.profile[id]).trim() : ""; }
function bizAns(id){ return state.biz && state.biz[id] ? String(state.biz[id]).trim() : ""; }
function bizReady(){ return !!(state.biz && (bizAns("biz_what") || bizAns("biz_goal"))); }
function name(){ return ans("name") || "A jövőbeli éned"; }
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function applyTheme(){
  var th = state.settings.theme;
  if(th==="system"){ document.documentElement.removeAttribute("data-theme"); }
  else{ document.documentElement.setAttribute("data-theme", th); }
}

/* ============ render root ============ */
function render(){
  var root = $("#app");
  if(view==="intro"){ root.innerHTML = viewIntro(); bindIntro(); }
  else if(view==="onboarding"){ root.innerHTML = viewOnboarding(); bindOnboarding(); }
  else if(view==="reveal"){ root.innerHTML = viewReveal(); bindReveal(); }
  else if(view==="bizintake"){ root.innerHTML = viewBizIntake(); bindBizIntake(); }
  else { root.innerHTML = viewApp(); bindApp(); }
}

/* ---------- intro ---------- */
function haloSVG(){
  return '<svg class="halo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<circle cx="50" cy="50" r="46" stroke="var(--accent)" stroke-opacity="0.28" stroke-width="1.4"/>'
    + '<circle cx="50" cy="50" r="33" stroke="var(--accent)" stroke-opacity="0.5" stroke-width="1.4"/>'
    + '<path d="M50 20 L54.5 45.5 L80 50 L54.5 54.5 L50 80 L45.5 54.5 L20 50 L45.5 45.5 Z" fill="var(--accent)"/>'
    + '<circle cx="50" cy="50" r="4.5" fill="var(--bg)"/>'
    + '</svg>';
}
function viewIntro(){
  return '<div class="screen"><div class="intro">'
    + haloSVG()
    + '<h1>Találkozz a<br>legjobb önmagaddal</h1>'
    + '<p class="lede">Építsd fel, aki lenni szeretnél. Aztán amikor elakadsz, ő megmutatja a következő lépést.</p>'
    + '<div class="steps">'
      + istep("1","Megalkotod","Néhány kérdés a személyiségről, testről, karrierről, szokásokról — és megszületik a jövőbeli éned.")
      + istep("2","Bármikor visszanézed","Egy hely, ahol emlékeztetheted magad, kivé válsz.")
      + istep("3","Iránytűként használod","Motiválatlan vagy, céltalan, vagy döntés előtt állsz? Leírod — és megmondja, mit tenne most ő a helyedben.")
    + '</div>'
    + '<button class="btn" id="start">Kezdjük el</button>'
    + '<p class="faint" style="text-align:center;font-size:13px;margin-top:14px">Minden a te telefonodon marad.</p>'
    + '</div></div>';
}
function istep(n,t,p){ return '<div class="istep"><div class="n">'+n+'</div><div><b>'+t+'</b><p>'+p+'</p></div></div>'; }
function bindIntro(){
  $("#start").onclick = function(){ draft = state.profile ? Object.assign({},state.profile) : {}; qIndex=0; view="onboarding"; render(); };
}

/* ---------- onboarding ---------- */
function viewOnboarding(){
  var q = QUESTIONS[qIndex];
  var val = draft[q.id]!=null ? draft[q.id] : "";
  var pct = Math.round((qIndex)/(QUESTIONS.length)*100);
  var chips = "";
  if(q.chips){
    chips = '<div class="row wrap" style="margin-bottom:16px">' + q.chips.map(function(c){
      return '<button type="button" class="chip" data-chip="'+esc(c)+'">'+esc(c)+'</button>';
    }).join("") + '</div>';
  }
  var isLast = qIndex===QUESTIONS.length-1;
  return '<div class="screen"><div class="qwrap">'
    + '<div class="progress"><i style="width:'+pct+'%"></i></div>'
    + '<div class="qhead" style="margin-top:14px"><span>'+(qIndex+1)+' / '+QUESTIONS.length+'</span>'
      + '<button class="backlink" id="skip">Kihagyom ›</button></div>'
    + '<div class="qcard">'
      + '<div class="dimtag">'+esc(q.dim)+'</div>'
      + '<h2>'+esc(q.q)+'</h2>'
      + '<p class="hint">'+esc(q.hint)+'</p>'
      + chips
      + '<textarea id="qa" placeholder="Írd ide…">'+esc(val)+'</textarea>'
    + '</div>'
    + '<div class="qnav">'
      + (qIndex>0 ? '<button class="btn ghost" id="prev" style="flex:0 0 40%">Vissza</button>' : '')
      + '<button class="btn" id="next">'+(isLast?"Kész — építsük fel":"Tovább")+'</button>'
    + '</div>'
    + '</div></div>';
}
function bindOnboarding(){
  var q = QUESTIONS[qIndex];
  var ta = $("#qa");
  ta.oninput = function(){ draft[q.id] = ta.value; };
  ta.focus();
  var chipbtns = document.querySelectorAll("[data-chip]");
  chipbtns.forEach(function(b){
    if((draft[q.id]||"")===b.getAttribute("data-chip")) b.classList.add("on");
    b.onclick = function(){
      ta.value = b.getAttribute("data-chip"); draft[q.id]=ta.value;
      chipbtns.forEach(function(x){x.classList.remove("on")}); b.classList.add("on"); ta.focus();
    };
  });
  var prev=$("#prev"); if(prev) prev.onclick=function(){ qIndex--; render(); };
  $("#skip").onclick = function(){ nextQ(); };
  $("#next").onclick = function(){ nextQ(); };
}
function nextQ(){
  if(qIndex < QUESTIONS.length-1){ qIndex++; render(); }
  else{
    state.profile = Object.assign({ _created: Date.now() }, draft, { _updated: Date.now() });
    save();
    view="reveal"; render();
  }
}

/* ---------- reveal ---------- */
function viewReveal(){

/* ---------- business intake ---------- */
function viewBizIntake(){

  out += '<div class="screen"><div class="pad">';
  out += '<p class="muted" style="margin:0 0 20px">Pár rövid kérdés a vállalkozásodról. Ezek alapján ad az Üzleti mentor szakmai, a helyzetedre szabott tanácsot. Bármikor módosíthatod.</p>';

function bindBizIntake(){
  $("#bizCancel").onclick=function(){ view="app"; render(); };

    ta.oninput=function(){ bizDraft[ta.getAttribute("data-biz")] = ta.value; };
  });
  document.querySelectorAll("[data-bchip]").forEach(function(b){
    b.onclick=function(){
      var field = b.closest(".bizfield");

      b.classList.add("on");
    };

    state.biz = Object.assign({ _created:(state.biz&&state.biz._created)||Date.now() }, bizDraft, { _updated:Date.now() });
    save();
    view="app"; tab="compass"; compass.mode="biz"; compass.result=null; render();
    toast("Vállalkozás-profil elmentve");
  };
}

/* ---------- SELF tab ---------- */
var editing = false;
function viewSelf(){
  var one = ans("oneline"), horizon = ans("horizon"), proud = ans("proud");
  var hero = '<div class="hero-self"><div class="lbl">'+esc(name())+(horizon?" · "+esc(horizon)+" múlva":"")+'</div>'
    + '<div class="oneline">'+(one?esc(one):'<span class="faint">—</span>')+'</div>'
    + (proud?'<div class="meta">A legbüszkébb: '+esc(proud)+'</div>':'')
    + '</div>';

  if(!editing){
    out += '<div class="daily"><div class="dl">Ma, tőled — '+esc(name())+'</div><p>'+esc(dailyMessage())+'</p></div>';
  }
  out += hero;
  if(!editing){
    var strk=streakCount(), acts=(state.actions||[]).length, sess=(state.history||[]).length;
    if(acts>0 || sess>0){
      out += '<div class="statstrip">'
        + '<div class="stat"><b>'+strk+'</b><span>napos sorozat</span></div>'
        + '<div class="stat"><b>'+acts+'</b><span>megtett lépés</span></div>'
        + '<div class="stat"><b>'+sess+'</b><span>iránytű-kérés</span></div>'
        + '</div>';
    }
  }
  SECTIONS.forEach(function(sec){
    var qs = QUESTIONS.filter(function(q){ return q.sec===sec.key && q.id!=="name" && q.id!=="horizon"; });
    if(!qs.length) return;
    out += '<div class="sec-title"><span class="k">'+String(SECTIONS.indexOf(sec)+1).padStart(2,"0")+'</span><h3>'+esc(sec.label)+'</h3></div>';
    out += '<div class="card">';
    qs.forEach(function(q){
      var a = ans(q.id);
      out += '<div class="qa"><div class="q">'+esc(q.q)+'</div>';
      if(editing){
        out += '<textarea class="edit-ta" data-edit="'+q.id+'" placeholder="'+esc(q.hint)+'">'+esc(a)+'</textarea>';
      }else{
        out += '<div class="a'+(a?"":" empty")+'">'+(a?esc(a):"— nincs kitöltve —")+'</div>';
      }
      out += '</div>';
    });
    out += '</div>';
  });
  if(editing){
    out += '<button class="btn ghost" id="fixAcc" style="margin-top:20px">✦ Ékezetek javítása AI-val</button>';
    out += '<div class="row" style="margin-top:10px"><button class="btn sage" id="saveEdit">Mentés</button></div>';
    out += '<button class="btn ghost" id="rebuild" style="margin-top:10px">Újraépítés az elejéről</button>';
  }
  return out;
}
function bindSelf(){
  var ea = $("#editAll");
  if(ea) ea.onclick=function(){ editing=!editing; render(); };
  if(editing){
    document.querySelectorAll("[data-edit]").forEach(function(ta){
      ta.oninput=function(){ state.profile[ta.getAttribute("data-edit")] = ta.value; };
    });
    $("#saveEdit").onclick=function(){ state.profile._updated=Date.now(); save(); editing=false; render(); toast("Elmentve"); };
    var fa=$("#fixAcc"); if(fa) fa.onclick=fixAccents;
    var rb=$("#rebuild"); if(rb) rb.onclick=function(){
      if(confirm("Biztosan újrakezded a kérdéssort? A mostani válaszaid megmaradnak alapnak.")){
        editing=false; draft=Object.assign({},state.profile); qIndex=0; view="onboarding"; render();
      }
    };
  }
}

      + '<textarea id="cin" placeholder="Pl. Nincs kedvem edzeni ma… / Két állás közül kell választanom… / Céltalannak érzem magam.">'+esc(compass.input)+'</textarea>'
      + '<div class="quicks">'

function qchip(t){ return '<button class="chip" data-quick="'+esc(t)+'">'+esc(t)+'</button>'; }

      body += '<div class="rblock"><div class="h">Mit tenne most ő</div><ul class="steps-list">'

        + '</ul></div>';
    }

  }
  var foot;

    foot = '<div class="doneflag">✓ Megtetted — sorozat: '+streakCount()+' nap 🔥</div>';

    var dmsg = isBiz ? "Megléptél valamit ez alapján?" : "Megtetted, amit "+esc(name())+" javasolt?";

function bindCompass(){

/* ---------- streak / actions / daily ---------- */
function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function markDone(){
  state.actions = state.actions || [];
  state.actions.unshift({ at:Date.now() });
  state.actions = state.actions.slice(0,1000);
  save();
}
function streakCount(){
  var acts = state.actions || [];
  if(!acts.length) return 0;
  var days = {};
  acts.forEach(function(a){ days[dayKey(a.at)] = true; });
  var d = new Date();
  if(!days[dayKey(d.getTime())]){ d.setDate(d.getDate()-1); if(!days[dayKey(d.getTime())]) return 0; }
  var streak = 0;
  while(days[dayKey(d.getTime())]){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

/* AI-t kérő JSON hívás (ékezet-javításhoz): sample -> API -> hiba */
function callJSON(input){
  return new Promise(function(resolve, reject){
    var parseJSON = function(text){ var m=text.match(/\{[\s\S]*\}/); if(!m) throw new Error("parse"); return JSON.parse(m[0]); };
    var apiJSON = function(){
      if(!state.settings.apiKey){ var er=new Error("no-ai"); er._msg="Ehhez élő AI kell — kapcsold be a Beállításokban"; reject(er); return; }
      if(providerName()==="gemini"){
        var url = "https://generativelanguage.googleapis.com/v1beta/models/"+geminiModel()+":generateContent?key="+encodeURIComponent(state.settings.apiKey);
        fetch(url, { method:"POST", headers:{ "content-type":"application/json" },
          body: JSON.stringify({ contents:[{ role:"user", parts:[{ text: input }] }], generationConfig:{ responseMimeType:"application/json", maxOutputTokens:2000 } })
        }).then(function(res){ if(!res.ok) throw new Error("http"); return res.json(); }).then(function(data){
          var c=data.candidates&&data.candidates[0];
          var text=(c&&c.content&&c.content.parts)?c.content.parts.map(function(p){return p.text||"";}).join(""):"";
          resolve(parseJSON(text));
        }, function(){ var er=new Error("api"); er._msg="AI hiba a javításnál"; reject(er); });
        return;
      }
      if(providerName()==="openrouter"){
        fetch("https://openrouter.ai/api/v1/chat/completions", { method:"POST", headers:{ "content-type":"application/json", "authorization":"Bearer "+state.settings.apiKey, "x-title":"Legjobb Enem" },
          body: JSON.stringify({ model: OR_PRIMARY, max_tokens:2000, messages:[{ role:"user", content: input + "\n\nKizárólag a JSON objektumot add vissza, semmi mást." }] })
        }).then(function(res){ if(!res.ok) throw new Error("http"); return res.json(); }).then(function(data){
          var text=(data.choices&&data.choices[0]&&data.choices[0].message)?data.choices[0].message.content:"";
          resolve(parseJSON(text));
        }, function(){ var er=new Error("api"); er._msg="AI hiba a javításnál"; reject(er); });
        return;
      }
      fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{ "content-type":"application/json", "x-api-key":state.settings.apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify({ model: qualityModel(), max_tokens:1500, messages:[{ role:"user", content: input + "\n\nKizárólag a JSON objektumot add vissza." }] })
      }).then(function(res){ if(!res.ok) throw new Error("http"); return res.json(); }).then(function(data){
        var text=(data.content||[]).map(function(c){return c.text||"";}).join("");
        resolve(parseJSON(text));
      }, function(){ var er=new Error("api"); er._msg="AI hiba a javításnál"; reject(er); });
    };
    if(window.claude && typeof window.claude.use==="function"){
      window.claude.use("sample").then(function(sample){
        if(!sample || !sample.json){ apiJSON(); return; }
        sample.json(input, { modelTier:"quick" }).then(function(obj){ resolve(obj); }, function(err){
          if(err && err.code==="rate_limited"){ var er=new Error("rl"); er._msg="Kicsit sok kérés — próbáld pár perc múlva"; reject(er); }
          else apiJSON();
        });
      }, function(){ apiJSON(); });
    } else { apiJSON(); }
  });
}

function getAI(situation, mode){
  var promptText = mode==="biz" ? buildBizPrompt(situation) : buildPrompt(situation);
  return new Promise(function(resolve, reject){
    var tryApi = function(){
      if(state.settings.apiKey){
        var p = providerName();
        var fn = p==="gemini" ? callGemini : (p==="openrouter" ? callOpenRouter : callAI);
        fn(situation, mode).then(resolve, function(e){ var er=new Error("api"); er._msg=(e&&e.message)?String(e.message):"ismeretlen hiba"; reject(er); });
      } else { var er=new Error("no-ai"); reject(er); }
    };
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("sample").then(function(sample){
        if(!sample){ tryApi(); return; }
        sample(promptText, { modelTier: qualityTier() }).then(function(res){
          if(res && res.text) resolve(res.text); else tryApi();
        }, function(err){
          if(err && err.code === "rate_limited"){ var er=new Error("rl"); er._msg="Kicsit sok kérés — próbáld pár perc múlva"; reject(er); }
          else tryApi();
        });
      }, function(){ tryApi(); });
    } else { tryApi(); }
  });
}
function pushHistory(input, result, ai, mode){

function buildOffline(q){
  var t = q.toLowerCase();

  var dim =
    has(["edz","sport","fut","kondi","mozg","test","izom","fáradt","fárad","súly","fogy"]) ? "sport" :
    has(["munk","meló","karrier","projekt","tanul","vizsg","üzlet","céltalan","cél ","cél,","cél.","feladat","főnök","pénz"]) ? "career" :
    has(["kaja","étel","cukor","diét","kinéz","tükör","ruh","haj","bőr"]) ? "look" :
    has(["barát","párom","csaj","fiú","család","kapcsolat","magány","konflik","szak"]) ? "people" :
    "general";

  var nm = name();
  var one = ans("oneline");
  var why = ans("why");
  var values = ans("values");

  // remind
  var remindPieces = [];
  if(one) remindPieces.push('Azt írtad, a legjobb éned: <b>«'+esc(one)+'»</b>.');
  var dimAns = {
    sport: ans("body"), career: (ans("career")||ans("careerwhy")),
    look: ans("look"), people: ans("people"), general: ans("inner")
  }[dim];
  if(dimAns){

    remindPieces.push(lead+' <b>'+esc(dimAns)+'</b>');
  }
  var remind = remindPieces.join(" ") || 'Te vagy az az ember, akivé válni szeretnél — <b>'+esc(nm)+'</b>.';

  // gap
  var gap;
  if(isDecision){
    gap = "Egy döntés előtt állsz. A választás nem arról szól, mi kényelmesebb most — hanem arról, melyik út visz közelebb ahhoz, aki lenni akarsz.";
  } else if(dim==="sport"){
    gap = nm+" nem hangulat szerint edz — hanem mert ez ő. A mostani éned egy szokást épít éppen. A kérdés csak az: a régit erősíted, vagy az újat.";
  } else if(dim==="career"){
    gap = "Az érzés, hogy céltalan vagy vagy halogatsz, nem a valóság — csak egy pillanat. "+nm+" is átment ezen, de nem állt meg benne.";
  } else {
    gap = "A motiváció nem előbb jön, aztán a tett. Fordítva működik: a legkisebb cselekvés hozza a lendületet. "+nm+" is így indul, amikor nehéz.";
  }

  // steps
  var steps = [];
  if(isDecision){
    steps.push('Tedd fel a kérdést: <b>melyik opció visz közelebb '+esc(nm)+'-hoz/hez?</b> A másik többnyire a régi énedet szolgálja.');
    steps.push('Képzeld el, hogy egy évvel a döntés után a jövőbeli éned visszanéz erre a pillanatra. Melyiket köszönné meg?');
    steps.push('Ha még mindig döntetlen: válaszd azt, ami kicsit ijesztőbb, de a te irányodba mutat. A kényelmes út ritkán visz új helyre.');
  } else if(dim==="sport"){
    steps.push('Ne az egész edzést nézd — csak az első 5 percet. Öltözz át és indulj el. A többi jön magától.');
    steps.push('Ma ne érzésből dönts, hanem identitásból: „Én az az ember vagyok, aki megcsinálja.”');
    steps.push('Csináld meg a lehető legkisebb verziót most. Egy rövid mozgás is közelebb visz, mint a tökéletes, amit elhalasztasz.');
  } else if(dim==="career"){
    steps.push('Írd le a következő <b>egyetlen</b> apró lépést — olyan kicsit, hogy 2 perc alatt elkezdhető. Csak azt csináld meg most.');
    if(why) steps.push('Olvasd újra, miért akarod ezt: „'+esc(why)+'”. Ez a horgony, amikor nincs kedv.');
    else steps.push('Emlékezz a célra, ami mögötte van — nem a feladatért csinálod, hanem azért, akivé válsz általa.');
    steps.push('Ne a teljes hegyet nézd. Ma csak egy kővel tedd feljebb magad. Holnap ott folytatod.');
  } else {
    steps.push('Kérdezd meg magadtól: <b>mit tenne most '+esc(nm)+'?</b> Csináld meg azt az egy dolgot, most.');
    steps.push('Válassz egy 2 perces cselekvést, ami az irányodba mutat, és kezdd el azonnal — mielőtt a fejed lebeszélne róla.');
    if(values) steps.push('Térj vissza az értékeidhez: „'+esc(values)+'”. Melyikük szerint cselekednél most?');
    else steps.push('Ne várd, hogy jókedved legyen hozzá. A lendület a tett után jön, nem előtte.');
  }

  // quote
  var quote;
  if(why) quote = 'Emlékszem, miért indultunk el: „'+esc(why)+'”. Egy lépés most közelebb hoz hozzám.';
  else if(isDecision) quote = 'Ne a félelem döntsön helyetted. Kérdezd meg, melyik választás hoz közelebb hozzám — és lépj afelé.';
  else quote = 'Nem kell nagynak lenned ma. Csak egy lépést tegyél felém. Én már várlak.';

  var r = { remind:remind, gap:esc(gap), steps:steps, quote:esc(quote), ai:false };
  return r;
}

function bindSettings(){
  var s = state.settings;
  $("#aiToggle").onclick=function(){ s.aiEnabled=!s.aiEnabled; save(); render(); };
  var ak=$("#apiKey"); if(ak) ak.oninput=function(){ s.apiKey=ak.value.trim(); save(); };
  var pv=$("#provider"); if(pv) pv.onchange=function(){ s.provider=pv.value; save(); render(); };
  var ql=$("#quality"); if(ql) ql.onchange=function(){ s.quality=ql.value; save(); };
  var eb=$("#editBiz"); if(eb) eb.onclick=function(){ bizDraft = state.biz?Object.assign({},state.biz):{}; view="bizintake"; render(); };
  var th=$("#theme"); if(th) th.onchange=function(){ s.theme=th.value; save(); applyTheme(); };

  $("#exportFile").onclick = exportBackup;
  $("#importFile").onclick = function(){ $("#fileInput").click(); };
  $("#fileInput").onchange = function(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ importBackup(rd.result); };
    rd.onerror = function(){ toast("Nem sikerült megnyitni a fájlt"); };
    rd.readAsText(f);
  };
  $("#copyExport").onclick = function(){ copyText($("#exportTa").value, "Vágólapra másolva"); };
  $("#wipe").onclick=function(){
    if(confirm("Biztosan törölsz mindent? Ez nem visszavonható.")){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      state = loadState(); view="intro"; tab="self"; editing=false; compass={input:"",result:null,loading:false}; render();
    }
  };
}
function copyText(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, function(){ fallbackCopy(text,msg); });
  } else fallbackCopy(text,msg);
}
function fallbackCopy(text,msg){
  var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(msg); }catch(e){ toast("Másold ki kézzel"); }
  document.body.removeChild(ta);
}
function backupPayload(){
  var readable = {};
  QUESTIONS.forEach(function(q){ readable[q.q] = ans(q.id); });
  return {
    app: "Legjobb Énem",
    version: 2,
    mentve: new Date().toISOString(),
    profil: state.profile,
    profil_olvashato: readable,
    vallalkozas: state.biz || null,
    elozmenyek: state.history || [],
    megtett_lepesek: state.actions || []
  };
}
function exportBackup(){
  var json = JSON.stringify(backupPayload(), null, 2);
  var box = $("#exportBox"); if(box){ box.hidden = false; $("#exportTa").value = json; }
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(function(dl){
      if(dl && dl.save){
        dl.save({ filename:"legjobb-enem-mentes.json", data:json }).then(function(){
          toast("Mentés elkészült");
        }, function(err){
          if(err && err.code === "declined") toast("Mentés megszakítva");
          else browserDownload(json);
        });
      } else { browserDownload(json); }
    }).catch(function(){ browserDownload(json); });
  } else { browserDownload(json); }
}
function browserDownload(json){
  try{
    var blob = new Blob([json], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "legjobb-enem-mentes.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast("Mentés fájlba elindult — másold ki alulról, ha nem indul el");
  }catch(e){ toast("Másold ki a szöveget alul"); }
}
function importBackup(text){
  try{
    var data = JSON.parse(text);
    var prof = data.profil || data.profile;
    if(!prof){ toast("Nem érvényes mentésfájl"); return; }
    state.profile = prof;
    state.biz = data.vallalkozas || data.biz || null;
    state.history = data.elozmenyek || data.history || [];
    state.actions = data.megtett_lepesek || data.actions || [];
    save();
    toast("Sikeresen visszaállítva");
    view = "app"; tab = "self"; editing = false; render();
  }catch(e){ toast("Nem sikerült beolvasni a fájlt"); }
}

/* ---------- misc ---------- */
function timeAgo(ts){
  var d=Date.now()-ts, m=Math.floor(d/60000), h=Math.floor(m/60), dy=Math.floor(h/24);
  if(m<1) return "az imént"; if(m<60) return m+" perce"; if(h<24) return h+" órája";
  if(dy<7) return dy+" napja"; return new Date(ts).toLocaleDateString("hu-HU");
}

/* ---------- app icon (PWA / kezdőképernyő) ---------- */
function drawCompass(size){
  var c=document.createElement("canvas"); c.width=size; c.height=size;
  var x=c.getContext("2d"); var s=size, m=s/2;
  x.fillStyle="#13171A"; x.fillRect(0,0,s,s);
  x.lineWidth=s*0.016;
  x.strokeStyle="rgba(228,169,82,0.32)"; x.beginPath(); x.arc(m,m,s*0.44,0,Math.PI*2); x.stroke();
  x.strokeStyle="rgba(228,169,82,0.60)"; x.beginPath(); x.arc(m,m,s*0.32,0,Math.PI*2); x.stroke();
  var R=s*0.30, r=s*0.066;
  x.fillStyle="#E4A952"; x.beginPath();
  for(var i=0;i<8;i++){ var ang=-Math.PI/2 + i*Math.PI/4; var rad=(i%2===0)?R:r; var px=m+Math.cos(ang)*rad, py=m+Math.sin(ang)*rad; if(i===0) x.moveTo(px,py); else x.lineTo(px,py); }
  x.closePath(); x.fill();
  x.fillStyle="#13171A"; x.beginPath(); x.arc(m,m,s*0.045,0,Math.PI*2); x.fill();
  return c.toDataURL("image/png");
}
function installIcons(){
  try{
    var head=document.head;
    var png180=drawCompass(180), png512=drawCompass(512);
    var meta=function(n,c){ var e=document.createElement("meta"); e.setAttribute("name",n); e.setAttribute("content",c); head.appendChild(e); };
    var link=function(rel,href,attrs){ var l=document.createElement("link"); l.setAttribute("rel",rel); l.setAttribute("href",href); if(attrs) Object.keys(attrs).forEach(function(k){ l.setAttribute(k,attrs[k]); }); head.appendChild(l); };
    link("apple-touch-icon", png180);
    link("icon", png512, { sizes:"512x512", type:"image/png" });
    meta("apple-mobile-web-app-capable","yes");
    meta("mobile-web-app-capable","yes");
    meta("apple-mobile-web-app-status-bar-style","black-translucent");
    meta("apple-mobile-web-app-title","Legjobb Énem");
    meta("theme-color","#13171A");
    var manifest={ name:"Legjobb Énem", short_name:"Legjobb Énem", display:"standalone", background_color:"#13171A", theme_color:"#13171A", start_url:".", icons:[
      { src:png512, sizes:"512x512", type:"image/png", purpose:"any maskable" },
      { src:png180, sizes:"180x180", type:"image/png" }
    ]};
    link("manifest", URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"})));
  }catch(e){}
}

/* ============ boot ============ */
applyTheme();
installIcons();
render();
